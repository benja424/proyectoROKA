<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Módulo Ambulancias | S.I.G.S.M.</title>
  <link rel="icon" type="image/png" href="/sigsm/frontend/img/logohc.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Source+Serif+4:wght@600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/sigsm/frontend/css/modulo-ambulancias.css">
</head>
<body>
<script>if (localStorage.getItem('dark') === '1') document.body.classList.add('dark');</script>

<div class="contenedor">

  <div class="topbar">
    <h1 class="topbar__titulo">Módulo Ambulancias</h1>
    <a href="/sigsm/frontend/portal-admin.html" class="btn-volver">← Volver al portal</a>
  </div>

  <!-- Estado de la flota (viene de la vista v_vehiculo_estado) -->
  <p class="seccion-titulo">Estado de vehículos</p>
  <div class="ambulancias-grid" id="flota"></div>

  <!-- Formulario de petición -->
  <p class="seccion-titulo" id="form-titulo">Registrar nuevo pedido de traslado</p>
  <div class="form-card">
    <form id="form-traslado" novalidate>
      <p class="mensaje" id="form-mensaje" role="status"></p>

      <!-- Bloque fijo: datos comunes -->
      <div class="form-grid">
        <div class="campo">
          <label for="razon">Razón del traslado</label>
          <input type="text" id="razon" maxlength="150" placeholder="Motivo de la petición" required>
        </div>
        <div class="campo">
          <label for="destino">Destino</label>
          <input type="text" id="destino" maxlength="150" placeholder="Dirección o institución de destino" required>
        </div>
        <div class="campo">
          <label for="hora_salida">Fecha y hora de salida</label>
          <input type="datetime-local" id="hora_salida" required>
        </div>
        <div class="campo">
          <label for="tipo_elemento">¿Qué se traslada?</label>
          <select id="tipo_elemento" required>
            <option value="Paciente">Paciente</option>
            <option value="Organo">Órgano</option>
            <option value="Muestra_biologica">Muestra biológica</option>
            <option value="Insumo_medico">Insumo médico</option>
            <option value="Documento">Documento</option>
            <option value="Equipamiento">Equipamiento</option>
          </select>
        </div>
      </div>

      <!-- Bloque variable: paciente -->
      <div class="form-bloque" id="bloque-paciente">
        <p class="form-subtitulo">Datos del paciente</p>
        <div class="campo">
          <label for="documento">Documento (CI)</label>
          <input type="text" id="documento" inputmode="numeric" maxlength="10" placeholder="Solo números, sin puntos ni guión">
          <p class="ayuda" id="ayuda-paciente"></p>
        </div>
        <div class="checks" style="margin-top:12px">
          <label class="check"><input type="checkbox" id="requiere_oxigeno"> Requiere oxígeno</label>
          <label class="check"><input type="checkbox" id="requiere_aislamiento"> Requiere aislamiento</label>
          <label class="check"><input type="checkbox" id="requiere_camilla"> Requiere camilla</label>
          <label class="check"><input type="checkbox" id="no_autonomo"> No es autónomo</label>
        </div>
      </div>

      <!-- Bloque variable: item -->
      <div class="form-bloque" id="bloque-item" hidden>
        <p class="form-subtitulo">Datos del elemento</p>
        <div class="form-grid">
          <div class="campo">
            <label for="item_nombre">Nombre</label>
            <input type="text" id="item_nombre" maxlength="80">
          </div>
          <div class="campo">
            <label for="item_caracteristicas">Características</label>
            <input type="text" id="item_caracteristicas" maxlength="255" placeholder="Opcional">
          </div>
        </div>
      </div>

      <!-- Vehículo y personal -->
      <div class="form-grid">
        <div class="campo campo--full">
          <label for="matricula">Vehículo</label>
          <select id="matricula" required></select>
          <p class="ayuda" id="ayuda-vehiculo"></p>
        </div>
        <div class="campo">
          <label for="chofer">Chofer</label>
          <input type="text" id="chofer" maxlength="60" required>
        </div>
        <div class="campo">
          <label for="enfermero">Enfermero/a</label>
          <input type="text" id="enfermero" maxlength="60" required>
        </div>
        <div class="campo campo--full">
          <label for="observaciones">Observaciones</label>
          <textarea id="observaciones" maxlength="255" placeholder="Opcional"></textarea>
        </div>
      </div>

      <div class="form-footer">
        <button type="button" class="btn-secundario" id="btn-cancelar-edicion" hidden>Cancelar edición</button>
        <button type="submit" class="btn-registrar" id="btn-guardar">Registrar traslado</button>
      </div>
    </form>
  </div>

  <!-- Historial -->
  <p class="seccion-titulo seccion-titulo--margen">Historial de traslados</p>
  <div class="filtros">
    <div class="campo"><label for="f-documento">Documento del paciente</label><input type="text" id="f-documento" inputmode="numeric"></div>
    <div class="campo"><label for="f-matricula">Vehículo</label><select id="f-matricula"><option value="">Todos</option></select></div>
    <div class="campo"><label for="f-estado">Estado</label>
      <select id="f-estado">
        <option value="">Todos</option>
        <option value="Solicitado">Solicitado</option>
        <option value="En_curso">En curso</option>
        <option value="En_destino">En destino</option>
        <option value="Retornado">Retornado</option>
        <option value="Cancelado">Cancelado</option>
      </select>
    </div>
  </div>
  <div class="lista-tras" id="historial"></div>

</div>

<script src="/sigsm/frontend/js/comun.js"></script>
<script src="/sigsm/frontend/js/auth.js"></script>
<script src="/sigsm/frontend/js/modulo-ambulancias.js"></script>
</body>
</html>
