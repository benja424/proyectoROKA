<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login Funcionarios | S.I.G.S.M. — Hospital de Clínicas</title>
  <link rel="icon" type="image/png" href="/sigsm/frontend/img/logohc.png">
  <link href="/sigsm/frontend/css/login.css" rel="stylesheet">
</head>

<body>

  <div class="login-card">

    <!-- Logo -->
      <a href="/sigsm/frontend/index.html" class="login-marca">
      <img src="/sigsm/frontend/img/logohc.png" alt="Hospital de Clínicas Dr. Manuel Quintela" class="login-marca__logo">
      <span class="login-marca__texto">
        <span class="login-marca__nombre">Hospital de Clínicas</span>
        <span class="login-marca__sistema">S.I.G.S.M.</span>
      </span>
    </a>

    <h1 class="login-titulo">Acceso para funcionarios</h1>
    <p class="login-subtitulo">Ingresá con tus credenciales institucionales.</p>

<form id="loginForm" onsubmit="return false;">

  <div class="campo">
    <label for="usuario">Usuario</label>
    <input type="text" id="usuario" name="usuario"
           placeholder="Ej: jperez"
           autocomplete="username" required>
  </div>

  <div class="campo">
    <label for="contrasena">Contraseña</label>
    <input type="password" id="contrasena" name="contrasena"
           placeholder="••••••••"
           autocomplete="current-password" required>
  </div>

  <p id="mensaje" style="color:#b91c1c; font-size:0.85rem; min-height:20px;"></p>

  <button type="submit" class="btn-ingresar">Ingresar</button>

</form>

    <p class="login-volver">
      ¿No sos funcionario? <a href="/sigsm/frontend/index.html">Volver al portal de pacientes</a>
    </p>

  </div>
  <script src="/sigsm/frontend/js/login.js"></script>
</body>
</html>
